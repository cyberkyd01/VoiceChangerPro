name: Windows release

# Builds, tests and packages the Windows app on a real Windows machine, then attaches the
# portable exe and the installer to the GitHub release for the pushed tag (for example v1.0.1).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, for example v1.0.1'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build, test, publish and package
        shell: pwsh
        run: .\build.ps1 -Publish -Installer

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "dist\VoiceChangerPro.exe"
          $setup = (Get-ChildItem installer\Output -Filter "VoiceChangerPro-Setup-*.exe" | Select-Object -First 1).FullName
          $hashes = foreach ($f in @($setup, $exe)) { "| $(Split-Path $f -Leaf) | ``$((Get-FileHash $f -Algorithm SHA256).Hash)`` |" }
          $notes = @"
          Windows 10/11 (64-bit). Download **VoiceChangerPro-Setup** (installer, recommended) or **VoiceChangerPro.exe** (portable).
          See [INSTALL.md](https://github.com/cyberkyd01/VoiceChangerPro/blob/main/INSTALL.md) for step-by-step instructions.

          | File | SHA-256 |
          |---|---|
          $($hashes -join "`n")
          "@
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "Voice Changer Pro by Cyberkyd $($env:TAG.TrimStart('v'))" --notes $notes
          }
          gh release upload $env:TAG $setup $exe --clobber
          $hashes | Write-Host
